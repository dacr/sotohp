sotohp {
  processors {
    data-cache {
      directory = ".sotohp"
      directory = ${?PHOTOS_CACHE_DIRECTORY}
    }
    miniaturizer {
      reference-sizes = [32, 64, 128, 256]
      quality = 0.75
      format = "jpg"
    }
    normalizer {
      reference-size = 1920
      quality = 0.9
      format = "jpg"
    }
    geocoding {
      geonames-directory = ".sotohp/geonames"
      geonames-directory = ${?PHOTOS_GEONAMES_DIRECTORY}
      cities-file = "cities500.txt"
      cities-file = ${?PHOTOS_GEONAMES_CITIES_FILE}
      max-distance-km = 150
      max-distance-km = ${?PHOTOS_GEONAMES_MAX_DISTANCE_KM}
    }
    captioner {
      # image-to-text: describe each photo with a local Ollama vision model.
      # off by default - needs `ollama serve` running and a multilingual vision model pulled,
      # e.g. `ollama pull qwen2.5vl:3b` (moondream is English-only and unreliable).
      enabled = false
      enabled = ${?PHOTOS_CAPTIONER_ENABLED}
      # 127.0.0.1, not "localhost": on Linux the latter often resolves to ::1 first and
      # Ollama binds IPv4 only, giving a confusing "Connection refused".
      base-url = "http://127.0.0.1:11434"
      base-url = ${?PHOTOS_CAPTIONER_BASE_URL}
      #model = "qwen2.5vl:3b"
      #model = "qwen3-vl:2b-instruct"
      model = "qwen3-vl:4b-instruct"
      #model = "qwen3-vl:8b-instruct"
      model = ${?PHOTOS_CAPTIONER_MODEL}
      prompt = "Décris cette photo en 2-3 phrases en français, en mentionnant les éléments principaux sans détails superflus. Retranscrit également tel quel le texte éventuellement présent en le plaçant entre guillement"
      prompt = ${?PHOTOS_CAPTIONER_PROMPT}
      # generous: a cold model load plus generation, possibly queued behind other requests
      timeout-seconds = 300
      timeout-seconds = ${?PHOTOS_CAPTIONER_TIMEOUT_SECONDS}
      # longest edge sent to the model (0 = send the 1920px normalized rendition unchanged)
      #max-image-size = 768
      max-image-size = 1200
      max-image-size = ${?PHOTOS_CAPTIONER_MAX_IMAGE_SIZE}
    }
  }
}
sotohp {
  processors {
    data-cache {
      directory = ".sotohp"
      directory = ${?PHOTOS_CACHE_DIRECTORY}
    }
    miniaturizer {
      reference-sizes = [32, 64, 128, 256]
      quality = 0.75
      format = "jpg"
    }
    normalizer {
      reference-size = 1920
      quality = 0.9
      format = "jpg"
    }
    geocoding {
      geonames-directory = ".sotohp/geonames"
      geonames-directory = ${?PHOTOS_GEONAMES_DIRECTORY}
      cities-file = "cities500.txt"
      cities-file = ${?PHOTOS_GEONAMES_CITIES_FILE}
      max-distance-km = 150
      max-distance-km = ${?PHOTOS_GEONAMES_MAX_DISTANCE_KM}
    }
    captioner {
      # image-to-text: describe each photo with a local Ollama vision model.
      # off by default - needs `ollama serve` running and a multilingual vision model pulled,
      # e.g. `ollama pull qwen2.5vl:3b` (moondream is English-only and unreliable).
      enabled = false
      enabled = ${?PHOTOS_CAPTIONER_ENABLED}
      # "ollama" (native /api/generate) or "openai" (/v1/chat/completions - LocalAI, vLLM,
      # llama.cpp's llama-server, and Ollama too). For LocalAI: api = "openai", base-url on its port
      # (e.g. http://127.0.0.1:8081) and model = the name `curl $base-url/v1/models` lists.
      api = "ollama"
      api = ${?PHOTOS_CAPTIONER_API}
      # 127.0.0.1, not "localhost": on Linux the latter often resolves to ::1 first and
      # Ollama binds IPv4 only, giving a confusing "Connection refused".
      base-url = "http://127.0.0.1:11434"
      base-url = ${?PHOTOS_CAPTIONER_BASE_URL}
      #model = "qwen2.5vl:3b" # ollama
      #model = "qwen3-vl:2b-instruct" # ollama
      #model = "qwen3-vl:4b-instruct" # ollama
      #model = "qwen3-vl:8b-instruct" # ollama
      #model = "qwen3-vl-8b-captioner" # localai (based on Qwen3-VL-8B-Instruct-Q5_K_M.gguf)
      model = "qwen3-vl-8b-q5-captioner" # localai (based on Qwen3-VL-8B-Instruct-Q5_K_M.gguf)
      model = ${?PHOTOS_CAPTIONER_MODEL}
      # Forbidding invented names matters: asked to transcribe text "if any", the model otherwise
      # makes some up (a church name on a photo without any text, "Achtung!" for an unreadable sign).
      prompt = "Décris cette photo en français, en 2 ou 3 phrases, en commençant directement par le sujet principal et sans détails superflus. N'invente aucun nom de lieu, de monument ou de personne. Si un texte est clairement lisible sur la photo, recopie-le tel quel, sans le traduire, entre guillemets « » à la fin de ta réponse ; s'il n'y en a pas ou s'il est illisible, n'ajoute rien."
      prompt = ${?PHOTOS_CAPTIONER_PROMPT}
      # generous: a cold model load plus generation, possibly queued behind other requests
      timeout-seconds = 300
      timeout-seconds = ${?PHOTOS_CAPTIONER_TIMEOUT_SECONDS}
      # longest edge sent to the model (0 = send the 1920px normalized rendition unchanged)
      #max-image-size = 768
      max-image-size = 1200
      max-image-size = ${?PHOTOS_CAPTIONER_MAX_IMAGE_SIZE}
    }
    face-features {
      # face embeddings engine:
      #   "djl"     - historical in-process model, unaligned faces (what every stored vector so far is)
      #   "localai" - InsightFace ArcFace served by a LocalAI server (POST /v1/face/embed): each face
      #               is re-detected and aligned on its landmarks server side, robust to head roll/tilt
      # Vectors are tagged with the model that computed them and never compared across models: after
      # switching, run `make run-compute-face-features` to re-embed the existing faces, then retune
      # and rerun inference and clustering (see the Makefile).
      engine = "localai"
      engine = ${?PHOTOS_FACE_FEATURES_ENGINE}
      # LocalAI's default port (8080) is taken by the sotohp API: start LocalAI on another one.
      base-url = "http://127.0.0.1:8081"
      base-url = ${?PHOTOS_FACE_FEATURES_BASE_URL}
      # insightface-buffalo-l: InsightFace reference pipeline (SCRFD + 5-point alignment + ArcFace R50,
      # 512-d, non-commercial weights) - the default, its "no face in this crop" answer is a clean 404.
      # face-detect-buffalo-l: same models on LocalAI's C++ backend (faster, but a crop with no face
      # comes back as a generic HTTP 500, which fails the whole photo instead of skipping that face),
      # face-detect-yunet-sface (SFace, 128-d, Apache 2.0)
      model = "insightface-buffalo-l"
      model = ${?PHOTOS_FACE_FEATURES_MODEL}
      timeout-seconds = 60
      timeout-seconds = ${?PHOTOS_FACE_FEATURES_TIMEOUT_SECONDS}
      # context kept around the detector box on each side, as a fraction of the box size
      crop-margin = 0.3
      crop-margin = ${?PHOTOS_FACE_FEATURES_CROP_MARGIN}
      # faces smaller than this (longest side, pixels of the full resolution original) are not embedded
      min-face-size = 40
      min-face-size = ${?PHOTOS_FACE_FEATURES_MIN_FACE_SIZE}
    }
  }
}